<!DOCTYPE html>
<html lang="fr" class="overflow-hidden h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Velagence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Invalidation totale du scroll */
    html, body {
      overflow: hidden;
      height: 100%;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-white text-zinc-900 font-sans antialiased selection:bg-zinc-900 selection:text-white w-full h-screen flex flex-col justify-between p-6 md:p-12 overflow-hidden">

  <!-- NAVIGATION HEADER -->
  <header class="flex justify-between items-center w-full shrink-0">
    <a href="index.html" class="text-2xl font-medium tracking-tighter uppercase">
      Velagence<span class="text-xs font-light align-top">®</span>
    </a>
    <a href="index.html" class="text-sm uppercase tracking-widest text-zinc-500 hover:text-zinc-900 transition-colors">
      ← Retour
    </a>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="w-full max-w-4xl mx-auto flex flex-col justify-center my-auto py-4">
    
    <!-- En-tête -->
    <div class="mb-6 md:mb-8">
      <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-1">*Booking & Candidatures*</span>
      <h1 class="text-4xl sm:text-6xl md:text-7xl font-medium tracking-tight uppercase">Contact.</h1>
    </div>

    <!-- Formulaire -->
    <form action="https://formspree.io/f/mgawrnol" method="POST" class="space-y-6 md:space-y-8">
      
      <!-- Champ Email -->
      <div class="flex flex-col border-b border-zinc-300 focus-within:border-zinc-900 transition-colors pb-2">
        <label for="email" class="text-[10px] md:text-xs uppercase tracking-widest text-zinc-400 mb-1 font-medium">Votre Email</label>
        <input 
          type="email" 
          name="email" 
          id="email" 
          required 
          placeholder="nom@exemple.com"
          class="w-full bg-transparent text-lg md:text-xl font-normal text-zinc-900 outline-none placeholder:text-zinc-300"
        >
      </div>

      <!-- Champ Sujet / Topic -->
      <div class="flex flex-col border-b border-zinc-300 focus-within:border-zinc-900 transition-colors pb-2">
        <label for="subject" class="text-[10px] md:text-xs uppercase tracking-widest text-zinc-400 mb-1 font-medium">Sujet / Motif</label>
        <select 
          name="subject" 
          id="subject" 
          required
          class="w-full bg-transparent text-lg md:text-xl font-normal text-zinc-900 outline-none cursor-pointer"
        >
          <option value="" disabled selected class="text-zinc-300">Sélectionnez une option</option>
          <option value="Booking / Projet">Booking & Shooting</option>
          <option value="Candidature Mannequin">Devenir Mannequin (Scouting)</option>
          <option value="Presse / Partenariat">Presse & Partenariats</option>
          <option value="Autre">Autre demande</option>
        </select>
      </div>

      <!-- Champ Message -->
      <div class="flex flex-col border-b border-zinc-300 focus-within:border-zinc-900 transition-colors pb-2">
        <label for="message" class="text-[10px] md:text-xs uppercase tracking-widest text-zinc-400 mb-1 font-medium">Votre Message</label>
        <textarea 
          name="message" 
          id="message" 
          rows="2" 
          required 
          placeholder="Décrivez votre projet..."
          class="w-full bg-transparent text-lg md:text-xl font-normal text-zinc-900 outline-none resize-none placeholder:text-zinc-300"
        ></textarea>
      </div>

      <!-- Bouton d'envoi -->
      <div class="pt-2">
        <button 
          type="submit" 
          class="bg-[#365354] text-white text-xs font-semibold uppercase tracking-widest px-8 py-4 rounded-full transition-transform hover:scale-105 cursor-pointer"
        >
          Envoyer le message
        </button>
      </div>

    </form>
  </main>

  <!-- BAS DE PAGE MINIMAL -->
  <footer class="flex flex-col sm:flex-row justify-between items-start sm:items-center text-xs text-zinc-400 shrink-0 pt-4 border-t border-zinc-100 gap-2">
    <p>Direct contact : <a href="mailto:velagence@icloud.com" class="text-zinc-900 underline">velagence@icloud.com</a></p>
    <p>© Velagence</p>
  </footer>

</body>
</html>
